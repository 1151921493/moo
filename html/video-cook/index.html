<!-- ✅ تنسيقات CSS -->
<style>
  .contact-widget {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
  }

  .main-toggle {
    background-color: #25D366;
    border: none;
    border-radius: 50%;
    padding: 15px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .contact-actions {
    display: none;
    flex-direction: column;
    margin-top: 10px;
    gap: 10px;
    align-items: center;
  }

  .contact-btn {
    background: white;
    border-radius: 50%;
    padding: 12px;
    color: #333;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s ease;
  }

  .contact-btn:hover {
    transform: scale(1.1);
  }

  .fa-whatsapp { color: #25D366; }
  .fa-phone { color: #007bff; }
</style>

<!-- ✅ JavaScript -->
<script>
  const toggleBtn = document.getElementById("mainToggleBtn");
  const contactActions = document.getElementById("contactActions");

  toggleBtn.addEventListener("click", () => {
    contactActions.style.display = contactActions.style.display === "flex" ? "none" : "flex";
  });
</script>
